<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="345" viewBox="0 0 1000 345" role="img" aria-labelledby="title desc"><title id="title">Deliver individual teams in increasing complexity</title><desc id="desc">Feasibility and shared foundation precede Sessions, Subagents, and Teammates. Each type is experienced before moving on; writing is gated separately.</desc><rect width="1000" height="345" rx="16" fill="#f4f7fb"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#18334c"><text x="500" y="35" font-size="23" font-weight="bold">Build → test → use → learn</text><rect x="235" y="55" width="530" height="51" rx="10" fill="#e0e8f3"/><text x="500" y="86" font-size="18">Small feasibility trial + shared team foundation</text><path d="M500 106V128H175V146 M500 128V146 M500 128H825V146" fill="none" stroke="#647d97" stroke-width="2"/><rect x="30" y="146" width="290" height="112" rx="12" fill="#d9eee5"/><rect x="355" y="146" width="290" height="112" rx="12" fill="#dce9fb"/><rect x="680" y="146" width="290" height="112" rx="12" fill="#e8e1f5"/><text x="175" y="175" font-size="21" font-weight="bold">1. Sessions</text><text x="500" y="175" font-size="21" font-weight="bold">2. Subagents</text><text x="825" y="175" font-size="21" font-weight="bold">3. Teammates</text><text x="175" y="206" font-size="17">You select focused sessions</text><text x="500" y="206" font-size="17">Lead assigns and integrates</text><text x="825" y="206" font-size="17">Peers discuss and coordinate</text><text x="175" y="235" font-size="15">Use the saved team for two goals</text><text x="500" y="235" font-size="15">Desktop capability must pass</text><text x="825" y="235" font-size="15">Experimental CLI, in-process</text><text x="338" y="209" font-size="26">→</text><text x="663" y="209" font-size="26">→</text><text x="500" y="295" font-size="18">One active team · Read-only first · Writing separately gated</text><text x="500" y="323" font-size="15">Reuse definitions and agreements; verify each runtime independently.</text></g></svg>