<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350"><rect width="900" height="350" rx="16" fill="#f4f7fb"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#19304a"><text x="450" y="35" font-size="22" font-weight="bold">Role authority bounds every assignment</text><rect x="230" y="55" width="440" height="65" rx="10" fill="#dce9fb"/><text x="450" y="82" font-size="18">Specialist → bounded subspecialist tasks</text><text x="450" y="106" font-size="15">Outputs + inputs + dependencies + integration owner</text><path d="M450 120V145H160V170 M450 145V170 M450 145H740V170" stroke="#58718d" stroke-width="2" fill="none"/><rect x="25" y="170" width="270" height="100" rx="10" fill="#d9eee5"/><rect x="315" y="170" width="270" height="100" rx="10" fill="#fff0cb"/><rect x="605" y="170" width="270" height="100" rx="10" fill="#e8e1f5"/><text x="160" y="197" font-size="18" font-weight="bold">Independent outputs</text><text x="160" y="225" font-size="16">Parallel work</text><text x="160" y="249" font-size="15">Same checkout is sufficient</text><text x="450" y="197" font-size="18" font-weight="bold">Shared file or dependency</text><text x="450" y="225" font-size="16">Sequence and hand off</text><text x="450" y="249" font-size="15">One active writer per file</text><text x="740" y="197" font-size="18" font-weight="bold">Competing changes</text><text x="740" y="225" font-size="16">Separate worktrees if supported</text><text x="740" y="249" font-size="15">Authorized integration + checks</text><text x="450" y="315" font-size="17">Folder separation helps; stable interfaces and inputs still matter.</text></g></svg>